name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  jvm-and-kmp-check:
    name: Build & Test JVM / Shared KMP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Checks & Unit Tests
        run: ./gradlew check --no-daemon

  macos-framework-check:
    name: Build macOS Kotlin/Native Targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Compile macOS Targets
        run: ./gradlew compileKotlinMacosArm64 compileKotlinMacosX64 --no-daemon
